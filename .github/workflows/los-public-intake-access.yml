name: Configure narrowly scoped public LOS intake paths

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/los-public-intake-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-access:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Diagnose Cloudflare Access API and configure approved paths
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/access/apps"
          HOST="yourbrokerpal-los--dscr.pages.dev"

          status=$(curl --silent --show-error -o /tmp/cf-access-list.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" "$API?per_page=100")
          echo "Access apps-list HTTP status: $status"
          jq -c '{success, errors, messages}' /tmp/cf-access-list.json
          [ "$status" = "200" ]
          list=$(cat /tmp/cf-access-list.json)
          echo "$list" | jq -e '.success == true' >/dev/null

          create_if_missing() {
            local path="$1"
            local name="$2"
            if echo "$list" | jq -e --arg d "$HOST$path" \
              '.result[]? | select(.domain == $d or any(.destinations[]?; .uri == ("https://" + $d) or .uri == $d))' >/dev/null; then
              echo "Already configured: $HOST$path"
              return 0
            fi
            echo "No existing exact-match application found for $HOST$path; attempting creation."
            local payload
            payload=$(jq -n --arg domain "$HOST$path" --arg name "$name" '{
              name: $name,
              domain: $domain,
              type: "self_hosted",
              session_duration: "24h",
              policies: [{
                name: ("Bypass only " + $name),
                decision: "bypass",
                include: [{ everyone: {} }]
              }]
            }')
            local status
            status=$(curl --silent --show-error -o /tmp/cf-access-create.json -w "%{http_code}" \
              -X POST "$API" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")
            echo "Access app-create HTTP status for $path: $status"
            jq -c '{success, errors, messages, result: (if .result then {id: .result.id, name: .result.name, domain: .result.domain} else null end)}' /tmp/cf-access-create.json
            [ "$status" = "200" ] || [ "$status" = "201" ]
            jq -e '.success == true' /tmp/cf-access-create.json >/dev/null
            echo "Created narrowly scoped Bypass application: $HOST$path"
          }

          create_if_missing "/api/public-leads" "Public LOS lead intake"
          create_if_missing "/api/email-preferences" "Public LOS email preferences"
