name: Refresh Astro security lockfile

on:
  push:
    branches:
      - feature/property-report-lead-center-label

permissions:
  contents: write

concurrency:
  group: astro-security-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Resolve patched Astro dependency tree
        run: npm install --package-lock-only --ignore-scripts --save-exact

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lockfile is already current."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "chore: refresh Astro security dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
