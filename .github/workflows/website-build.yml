name: Website build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Report dependency security findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node <<'NODE'
          const fs = require("fs");
          for (const [scope, path] of [["all dependencies", "/tmp/npm-audit.json"], ["production dependencies only", "/tmp/npm-audit-production.json"]]) {
            const audit = JSON.parse(fs.readFileSync(path, "utf8"));
            console.log("AUDIT SCOPE: " + scope);
            console.log(JSON.stringify({
              metadata: audit.metadata?.vulnerabilities,
              advisories: Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({
                name,
                severity: item.severity,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(value => typeof value === "string" ? value : { title: value.title, url: value.url, range: value.range })
              }))
            }, null, 2));
          }
          NODE
      - name: Preview compatible dependency security fixes
        run: |
          npm audit fix --dry-run --json > /tmp/npm-audit-fix-plan.json || true
          node -e 'const p=require("/tmp/npm-audit-fix-plan.json"); console.log(JSON.stringify({added:p.added,removed:p.removed,changed:p.changed,audit:p.audit?.metadata?.vulnerabilities,topLevel:p.added||p.removed||p.changed ? "Review proposed dependency tree before applying" : "No compatible changes reported"},null,2))'
      - name: Build website
        run: npm run check
      - name: Run billing safety unit tests
        run: npm test
      - name: Read-only property usage D1 migration status
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: npx wrangler d1 migrations list yourbrokerpal-property-usage --remote --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Read-only property usage D1 metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: npx wrangler d1 info yourbrokerpal-property-usage --config wrangler.json --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy isolated preview
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feature/investor-education-page' || github.event.pull_request.head.ref == 'fix/about-page-readability' || github.event.pull_request.head.ref == 'feature/property-report-lead-center-label') && github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler versions upload --config wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
