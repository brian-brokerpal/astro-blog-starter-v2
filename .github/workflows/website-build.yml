name: Website build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Inventory dependency security advisories
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/npm-audit.json","utf8"));const v=a.metadata?.vulnerabilities||{};console.log("Dependency audit totals:",JSON.stringify(v));for(const [name,item] of Object.entries(a.vulnerabilities||{})){const via=(item.via||[]).map(x=>typeof x==="string"?x:x.title);console.log(JSON.stringify({package:name,severity:item.severity,isDirect:item.isDirect,range:item.range,fixAvailable:item.fixAvailable,advisories:via}));}'
      - name: Run intake regression tests
        run: npm test
      - name: Build website
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy isolated preview
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feature/investor-education-page' || github.event.pull_request.head.ref == 'fix/about-page-readability' || github.event.pull_request.head.ref == 'fix/public-property-report-idempotency') && github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler versions upload --config wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
