name: Website build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Require clean production dependency audit
        run: npm audit --omit=dev
      - name: Report dependency security findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node <<'NODE'
          const fs = require("fs");
          for (const [scope, path] of [["all dependencies", "/tmp/npm-audit.json"], ["production dependencies only", "/tmp/npm-audit-production.json"]]) {
            const audit = JSON.parse(fs.readFileSync(path, "utf8"));
            console.log("AUDIT SCOPE: " + scope);
            console.log(JSON.stringify({
              metadata: audit.metadata?.vulnerabilities,
              advisories: Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({
                name,
                severity: item.severity,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(value => typeof value === "string" ? value : { title: value.title, url: value.url, range: value.range })
              }))
            }, null, 2));
          }
          NODE
      - name: Preview compatible dependency security fixes
        run: |
          npm audit fix --dry-run --loglevel=error > /tmp/npm-audit-fix-plan.txt 2>&1 || true
          echo "Non-mutating npm audit fix preview (review before applying):"
          tail -n 100 /tmp/npm-audit-fix-plan.txt
      - name: Build website
        run: npm run check
      - name: Run billing safety unit tests
        run: npm test
      - name: Read-only property usage D1 migration status
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: npx wrangler d1 migrations list yourbrokerpal-property-usage --remote --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Read-only website Worker secret names
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: npx wrangler secret list --name astro-blog-starter-v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Read-only property usage D1 metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: npx wrangler d1 info yourbrokerpal-property-usage --config wrangler.json --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload and smoke-test isolated preview version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/property-report-lead-center-label' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.preview.json | tee /tmp/wrangler-preview-upload.log
          PREVIEW_URL="$(sed -n 's/.*Version Preview URL: //p' /tmp/wrangler-preview-upload.log | tail -n 1 | tr -d '\r')"
          test -n "$PREVIEW_URL"
          echo "Preview URL: $PREVIEW_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "$PREVIEW_URL/" -o /tmp/preview-home.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "$PREVIEW_URL/tools/property-report" -o /tmp/preview-property-report.html
          for path in /api/census.json /api/property-valuation.json; do
            status="$(curl --silent --show-error -o /tmp/preview-api-body -w '%{http_code}' "$PREVIEW_URL$path")"
            test "$status" = "503"
          done
          status="$(curl --silent --show-error -o /tmp/preview-lead-body -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$PREVIEW_URL/api/public-leads")"
          test "$status" = "503"
          echo "Preview pages load; lead intake and external data APIs are safely disabled."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
