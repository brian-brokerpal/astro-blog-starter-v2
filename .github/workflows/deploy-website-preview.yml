name: Deploy Broker Pal website preview

on:
  push:
    branches:
      - website-polish-broker-pal-brand

permissions:
  contents: read

concurrency:
  group: broker-pal-website-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview website
        run: npm run build

      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --config wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
