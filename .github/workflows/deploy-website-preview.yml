name: Deploy Broker Pal website preview

on:
  push:
    branches:
      - website-polish-broker-pal-brand

permissions:
  contents: write

concurrency:
  group: broker-pal-website-wordmark-security-final
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade Astro and official integrations to patched releases
        run: |
          npm install --save-exact astro@latest @astrojs/cloudflare@latest @astrojs/mdx@latest @astrojs/rss@latest @astrojs/sitemap@latest
          npm install --save-dev --save-exact wrangler@latest typescript@latest

      - name: Apply non-breaking security patches
        run: npm audit fix

      - name: Audit dependency tree
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('POST-UPGRADE NPM AUDIT:', JSON.stringify(counts, null, 2));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:item.via.map(v => typeof v === 'string' ? v : {title:v.title,url:v.url,range:v.range})}));
          }
          NODE

      - name: Build and type-check against isolated Preview config
        run: |
          npm run build
          npx tsc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          if (config.d1_databases?.length) throw new Error('Preview build unexpectedly contains a D1 binding.');
          if (config.previews?.vars?.SITE_ENV !== 'preview') throw new Error('Preview environment marker is missing.');
          console.log('PASS: generated Preview config has no D1 binding and SITE_ENV=preview.');
          NODE
          npx wrangler deploy --dry-run --config dist/server/wrangler.json
        env:
          BROKER_PAL_PREVIEW: '1'

      - name: Save verified dependency updates to feature branch
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency manifests already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Upgrade Astro stack and remediate dependency advisories"
            git push origin HEAD:website-polish-broker-pal-brand
          fi

      - name: Configure isolated Preview session storage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const run = (args) => execFileSync('npx', ['wrangler', ...args], { encoding: 'utf8' });
          const list = JSON.parse(run(['kv', 'namespace', 'list', '--json']));
          let namespace = list.find(item => item.title === 'broker-pal-preview-session');
          if (!namespace) {
            const created = JSON.parse(run(['kv', 'namespace', 'create', 'broker-pal-preview-session', '--json']));
            namespace = created;
          }
          if (!namespace?.id) throw new Error('Could not obtain the isolated Preview KV namespace ID.');

          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.d1_databases?.length) throw new Error('Refusing to deploy Preview with a D1 database binding.');
          config.name = 'website-polish-broker-pal-wordmark-security-final';
          config.kv_namespaces = (config.kv_namespaces ?? []).filter(binding => binding.binding !== 'SESSION');
          config.kv_namespaces.push({ binding: 'SESSION', id: namespace.id });
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\\n');
          console.log('Preview isolated KV configured; production D1 binding is absent.');
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create isolated Cloudflare Worker Preview
        run: npx wrangler preview --config dist/server/wrangler.json --name website-polish-broker-pal-wordmark-security-final
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish dependency audit summary
        if: always()
        run: |
          if [ -f npm-audit-report.json ]; then
            node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("npm-audit-report.json","utf8")).metadata?.vulnerabilities ?? {}; let s="## Dependency audit after remediation\\n\\n| Severity | Count |\\n|---|---:|\\n"; for (const k of ["critical","high","moderate","low","info"]) s += "| "+k+" | "+(v[k] ?? 0)+" |\\n"; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s);'
          fi
