name: Deploy Broker Pal website preview

on:
  push:
    branches:
      - website-polish-broker-pal-brand

permissions:
  contents: write

# Preview validates the committed lockfile and never modifies production resources.

concurrency:
  group: broker-pal-website-wordmark-security-final
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependency tree
        run: |
          npm audit --audit-level=low --json > npm-audit-report.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('LOCKFILE NPM AUDIT:', JSON.stringify(counts, null, 2));
          if ((counts.total ?? 0) > 0) {
            throw new Error('Dependency audit found vulnerabilities; review npm-audit-report.json.');
          }
          NODE

      - name: Build and type-check against isolated Preview config
        run: |
          npm run build
          npx tsc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.d1_databases?.length) throw new Error('Preview build unexpectedly contains a D1 binding.');
          if (config.previews?.vars?.SITE_ENV !== 'preview') throw new Error('Preview environment marker is missing.');
          // Astro's adapter emits an empty SESSION KV placeholder even though
          // Astro sessions are explicitly disabled for Preview. Remove only that
          // unused placeholder; never attach a real KV or production namespace.
          if (config.kv_namespaces) {
            config.kv_namespaces = config.kv_namespaces.filter(binding => binding.binding !== 'SESSION');
            if (config.kv_namespaces.length === 0) delete config.kv_namespaces;
          }
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          if (config.kv_namespaces?.some(binding => binding.binding === 'SESSION')) {
            throw new Error('Unused SESSION KV placeholder was not removed.');
          }
          console.log('PASS: Preview config has no D1 binding, no SESSION KV binding, and SITE_ENV=preview.');
          NODE
          npx wrangler deploy --dry-run --config dist/server/wrangler.json
        env:
          BROKER_PAL_PREVIEW: '1'

      - name: Create isolated Cloudflare Worker Preview
        run: npx wrangler preview --config dist/server/wrangler.json --name website-polish-broker-pal-wordmark-security-final
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish dependency audit summary
        if: always()
        run: |
          if [ -f npm-audit-report.json ]; then
            node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("npm-audit-report.json","utf8")).metadata?.vulnerabilities ?? {}; let s="## Dependency audit\n\n| Severity | Count |\n|---|---:|\n"; for (const k of ["critical","high","moderate","low","info"]) s += "| "+k+" | "+(v[k] ?? 0)+" |\n"; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s);'
          fi
