name: Deploy Broker Pal website preview

on:
  push:
    branches:
      - website-polish-broker-pal-brand

permissions:
  contents: read

# This workflow only updates the isolated Wrangler Preview deployment.
# It never deploys the production Worker or binds production D1/KV resources.

concurrency:
  group: broker-pal-website-wordmark-security-final
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependency tree
        run: |
          npm audit --audit-level=low --json > npm-audit-report.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('LOCKFILE NPM AUDIT:', JSON.stringify(counts, null, 2));
          if ((counts.total ?? 0) > 0) {
            throw new Error('Dependency audit found vulnerabilities; review npm-audit-report.json.');
          }
          NODE

      - name: Build and type-check against isolated Preview config
        run: |
          npm run build
          npx tsc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.d1_databases?.length) throw new Error('Preview build unexpectedly contains a D1 binding.');
          if (config.previews?.vars?.SITE_ENV !== 'preview') throw new Error('Preview environment marker is missing.');
          if (config.kv_namespaces?.some(binding => binding.binding === 'SESSION')) {
            throw new Error('Preview build unexpectedly contains a SESSION KV binding.');
          }
          const preview = JSON.parse(fs.readFileSync('wrangler.preview.json', 'utf8'));
          if (preview.d1_databases?.length || preview.kv_namespaces?.length) {
            throw new Error('Standalone Preview config must not contain D1 or KV bindings.');
          }
          if (preview.previews?.vars?.SITE_ENV !== 'preview') {
            throw new Error('Standalone Preview config is missing SITE_ENV=preview.');
          }
          console.log('PASS: generated and standalone Preview configs are isolated from production data bindings.');
          NODE

      - name: Publish isolated Cloudflare Worker Preview
        # Restore the previously successful deployment path: the standalone Preview
        # config, rather than Astro's generated dist/server/wrangler.json.
        run: |
          set -euo pipefail
          npx wrangler preview --config wrangler.preview.json --name website-polish-broker-pal-wordmark-security-final 2>&1 | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(sed -n 's/^Preview URL: //p' /tmp/wrangler-preview.log | tail -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Wrangler did not return a Preview URL."
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview URL returned: $PREVIEW_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify preview serves the Broker Pal website
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl --silent --show-error --location --max-time 30 --output /tmp/broker-pal-preview.html --write-out '%{http_code}' "$PREVIEW_URL/")"
          echo "Preview HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Preview did not return HTTP 200."
            head -c 1200 /tmp/broker-pal-preview.html || true
            exit 1
          fi
          if ! grep -Eiq 'Broker Pal|YourBrokerPal' /tmp/broker-pal-preview.html; then
            echo "Preview returned HTTP 200 but did not contain the expected Broker Pal page content."
            head -c 2000 /tmp/broker-pal-preview.html
            exit 1
          fi
          echo "PASS: Preview returns the Broker Pal website HTML."

      - name: Publish dependency audit summary
        if: always()
        run: |
          if [ -f npm-audit-report.json ]; then
            node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("npm-audit-report.json","utf8")).metadata?.vulnerabilities ?? {}; let s="## Dependency audit\n\n| Severity | Count |\n|---|---:|\n"; for (const k of ["critical","high","moderate","low","info"]) s += "| "+k+" | "+(v[k] ?? 0)+" |\n"; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,s);'
          fi
