name: Deploy Broker Pal website to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: brokerpal-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Diagnose Cloudflare token and account
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Re-run after the D1 Read permission update.
      - name: Verify token account matches configured deployment account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami --json > /tmp/whoami.json
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/whoami.json', 'utf8'));
          const ids = [];
          function walk(value, key = '') {
            if (!value || typeof value !== 'object') return;
            for (const [k, v] of Object.entries(value)) {
              if ((k === 'id' || k === 'account_id' || k === 'accountId') &&
                  typeof v === 'string' && /^[a-f0-9]{32}$/i.test(v)) ids.push(v);
              walk(v, k);
            }
          }
          walk(data);
          const configured = process.env.CLOUDFLARE_ACCOUNT_ID;
          const match = ids.some(id => id.toLowerCase() === configured.toLowerCase());
          console.log(match
            ? 'PASS: token account ID matches CLOUDFLARE_ACCOUNT_ID.'
            : 'FAIL: token account ID does not match CLOUDFLARE_ACCOUNT_ID.');
          if (!ids.length) console.log('Diagnostic: whoami JSON did not expose an account ID in the expected format.');
          if (!match) process.exit(1);
          NODE

      - name: Diagnose Cloudflare D1 API authorization (non-blocking)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          TOKEN_STATUS=$(curl -sS -o /tmp/token-verify.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          META_STATUS=$(curl -sS -o /tmp/d1-meta.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/3089c709-9f68-4740-b15e-2c7d6060a0b6" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          QUERY_STATUS=$(curl -sS -o /tmp/d1-query.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/3089c709-9f68-4740-b15e-2c7d6060a0b6/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"sql":"SELECT 1 AS connection_test"}')
          export META_STATUS QUERY_STATUS TOKEN_STATUS
          node <<'NODE'
          const fs = require('fs');
          const token = JSON.parse(fs.readFileSync('/tmp/token-verify.json', 'utf8'));
          console.log('Account token verification HTTP status:', process.env.TOKEN_STATUS);
          console.log('Account token status:', token.result?.status ?? 'not returned');
          for (const [label, status, file] of [
            ['D1 database metadata GET', process.env.META_STATUS, '/tmp/d1-meta.json'],
            ['D1 SQL query POST', process.env.QUERY_STATUS, '/tmp/d1-query.json']
          ]) {
            let data = {};
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
            console.log(label + ' HTTP status:', status);
            console.log(label + ' API success:', data.success === true);
            if (data.errors?.length) console.log(label + ' API errors:', JSON.stringify(data.errors));
            if (data.success && label.includes('query')) console.log('Direct D1 SQL query succeeded.');
          }
          if (process.env.META_STATUS !== '200' || process.env.QUERY_STATUS !== '200') process.exit(1);
          NODE

      - name: Attach Census API key to production Worker
        run: printf '%s' "$CENSUS_API_KEY" | npx wrangler versions secret put CENSUS_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

