name: Deploy Broker Pal website to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: brokerpal-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Diagnose Cloudflare token and account
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 database is visible to this token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 3089c709-9f68-4740-b15e-2c7d6060a0b6
        run: |
          http_status=$(curl -sS -o d1-response.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID")
          echo "D1 API HTTP status: $http_status"
          echo "D1 API response:"
          cat d1-response.json
          if [ "$http_status" != "200" ]; then exit 1; fi
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("d1-response.json","utf8"));console.log(JSON.stringify({success:r.success,errors:r.errors,result:r.result?{name:r.result.name,uuid:r.result.uuid,version:r.result.version}:null}));if(!r.success)process.exit(1);'
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attach Census API key to production Worker
        run: printf '%s' "$CENSUS_API_KEY" | npx wrangler secret put CENSUS_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
