name: Deploy Broker Pal website to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: brokerpal-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Diagnose Cloudflare token and account
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Re-run after the D1 Read permission update.
      - name: Verify token account matches configured deployment account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami --json > /tmp/whoami.json
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/whoami.json', 'utf8'));
          const ids = [];
          function walk(value, key = '') {
            if (!value || typeof value !== 'object') return;
            for (const [k, v] of Object.entries(value)) {
              if ((k === 'id' || k === 'account_id' || k === 'accountId') &&
                  typeof v === 'string' && /^[a-f0-9]{32}$/i.test(v)) ids.push(v);
              walk(v, k);
            }
          }
          walk(data);
          const configured = process.env.CLOUDFLARE_ACCOUNT_ID;
          const match = ids.some(id => id.toLowerCase() === configured.toLowerCase());
          console.log(match
            ? 'PASS: token account ID matches CLOUDFLARE_ACCOUNT_ID.'
            : 'FAIL: token account ID does not match CLOUDFLARE_ACCOUNT_ID.');
          if (!ids.length) console.log('Diagnostic: whoami JSON did not expose an account ID in the expected format.');
          if (!match) process.exit(1);
          NODE

      - name: Test read-only access to the configured D1 database
        run: npx wrangler d1 execute yourbrokerpal-property-usage --remote --command="SELECT 1 AS connection_test"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attach Census API key to production Worker
        run: printf '%s' "$CENSUS_API_KEY" | npx wrangler secret put CENSUS_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
